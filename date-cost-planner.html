<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デート費用シミュレーター｜デートコンパス</title><meta name="description" content="デート3スポットの入場料・体験料・食事・交通費を入力し、2人分の予算を計算。未確認料金を無料扱いしません。"><link rel="canonical" href="https://goonyogunyo-prog.github.io/date-compass/date-cost-planner.html"><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:auto;padding:20px} .fee-card{padding:18px;border:1px solid #ddd;border-radius:16px;margin:14px 0;background:white}label{display:block;margin:10px 0}input,select{padding:10px;max-width:100%;border:1px solid #bbb;border-radius:8px}input[type=number]{width:140px} .total{font-size:1.5rem;font-weight:800} .muted{color:#555} .gridfee{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}a{overflow-wrap:anywhere}</style></head><body><main><p><a href="index.html">← トップ</a> ｜ <a href="date-gacha.html">ガチャに戻る</a> ｜ <a href="date-admission-guide.html">公式料金・見どころ</a></p><h1>3スポットのデート費用計算</h1><p>行き先を選び、<strong>公式確認済みの固定料金は自動入力、変動料金や未確認料金は公式ページを確認して手入力</strong>すると2人分の予算を計算します。料金未入力は「未算入」として残し、無料とは判定しません。</p><div class="gridfee"><label>2人の予算上限（円）<input id="limit" type="number" min="0" step="100" value="10000"></label><label>交通費・2人合計（円）<input id="transport" type="number" min="0" step="100" placeholder="未算入"></label><label>食事・カフェ代・2人合計（円）<input id="food" type="number" min="0" step="100" placeholder="未算入"></label></div><div id="cards"></div><section class="fee-card" aria-live="polite"><h2>予算の計算結果</h2><p id="result" class="total"></p><p id="missing" class="muted"></p><p id="limitresult"></p></section><p class="muted">料金は時期・曜日・企画展・年齢などで変動します。公式情報を確認し、購入直前にも最新価格をご確認ください。交通費は出発地により異なります。</p></main><script src="date-cost-planner.js"></script></body></html>
